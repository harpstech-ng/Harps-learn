<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Class Room - HarpsLearn</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .navbar {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0.5rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .navbar .class-info .title {
            font-weight: 700;
            font-size: 1rem;
        }
        .navbar .class-info .sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
        }
        .navbar .timer {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            font-variant-numeric: tabular-nums;
        }
        .navbar .end-btn {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 6px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .navbar .end-btn:hover { background: rgba(239,68,68,0.3); }

        .container {
            display: flex;
            height: calc(100vh - 60px);
            gap: 0.8rem;
            padding: 0.8rem;
        }

        .video-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            min-width: 0;
        }
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 0.8rem;
            min-height: 300px;
        }
        .video-box {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-box .placeholder {
            text-align: center;
            color: rgba(255,255,255,0.3);
        }
        .video-box .placeholder .icon { font-size: 3rem; display: block; }
        .video-box .label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            min-width: 250px;
            max-width: 400px;
        }
        .sidebar .tab-bar {
            display: flex;
            gap: 0.3rem;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 0.2rem;
        }
        .sidebar .tab-bar button {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }
        .sidebar .tab-bar button.active {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .sidebar .tab-content {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 0.8rem;
            overflow-y: auto;
            min-height: 200px;
        }
        .sidebar .tab-content::-webkit-scrollbar { width: 4px; }
        .sidebar .tab-content::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 4px; }

        .chat-messages {
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .chat-messages .msg {
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            max-width: 90%;
        }
        .chat-messages .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .chat-messages .msg.other {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
        }
        .chat-messages .msg .name { font-weight: 600; font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        .chat-messages .msg .time { font-size: 0.6rem; color: rgba(255,255,255,0.3); margin-left: 4px; }

        .chat-input {
            display: flex;
            gap: 0.4rem;
            padding: 0.4rem 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .chat-input input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 0.9rem;
        }
        .chat-input input:focus { outline: none; border-color: #667eea; }
        .chat-input input::placeholder { color: rgba(255,255,255,0.3); }
        .chat-input button {
            padding: 6px 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .chat-input button:hover { transform: scale(1.02); }

        .whiteboard-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .whiteboard-container canvas {
            flex: 1;
            background: white;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
        }
        .whiteboard-tools {
            display: flex;
            gap: 0.4rem;
            padding: 0.4rem 0;
            flex-wrap: wrap;
        }
        .whiteboard-tools button {
            padding: 4px 12px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.6);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .whiteboard-tools button:hover { background: rgba(255,255,255,0.08); }
        .whiteboard-tools button.active { background: rgba(255,255,255,0.12); color: #fff; }
        .whiteboard-tools .color-picker { width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; }

        .tab-content.hidden { display: none; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 5000;
            animation: toastSlide 0.4s ease;
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .toast.success { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.2); }
        .toast.error { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.2); }
        .toast.warning { background: rgba(251,191,36,0.2); border-color: rgba(251,191,36,0.2); }
        @keyframes toastSlide {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mark Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 6000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay .modal {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.06);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay .modal h3 { font-size: 1.3rem; color: #fff; margin-bottom: 1rem; }
        .modal-overlay .modal .form-group { margin-bottom: 1rem; }
        .modal-overlay .modal .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        .modal-overlay .modal .form-group input,
        .modal-overlay .modal .form-group textarea,
        .modal-overlay .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .modal-overlay .modal .form-group input:focus,
        .modal-overlay .modal .form-group textarea:focus,
        .modal-overlay .modal .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-overlay .modal .form-group textarea { min-height: 80px; resize: vertical; }
        .modal-overlay .modal .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .modal-overlay .modal .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .modal-overlay .modal .modal-actions .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .modal-overlay .modal .modal-actions .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .video-grid { grid-template-columns: 1fr; min-height: 200px; }
            .sidebar { max-width: 100%; min-width: unset; max-height: 400px; }
            .navbar .timer { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <div class="navbar">
        <div class="left">
            <div class="class-info">
                <div class="title" id="className">Live Class</div>
                <div class="sub" id="classSub">Tutor: Loading... • Student: Loading...</div>
            </div>
        </div>
        <div class="timer" id="timerDisplay">00:00</div>
        <button class="end-btn" onclick="endClass()">🚪 End Class</button>
    </div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <!-- Video Section -->
        <div class="video-section">
            <div class="video-grid">
                <div class="video-box" id="localVideoBox">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="label">📷 You</div>
                </div>
                <div class="video-box" id="remoteVideoBox">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="placeholder">
                        <span class="icon">👤</span>
                        <p>Waiting for other participant...</p>
                    </div>
                    <div class="label" id="remoteLabel">👤 Other</div>
                </div>
            </div>
            <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;">
                <button onclick="toggleAudio()" class="btn-control" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:#fff;padding:6px 16px;border-radius:10px;cursor:pointer;font-weight:600;">🔊 Audio</button>
                <button onclick="toggleVideo()" class="btn-control" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:#fff;padding:6px 16px;border-radius:10px;cursor:pointer;font-weight:600;">📹 Video</button>
                <button onclick="shareScreen()" class="btn-control" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:#fff;padding:6px 16px;border-radius:10px;cursor:pointer;font-weight:600;">🖥️ Share Screen</button>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="tab-bar">
                <button class="active" data-tab="chat" onclick="switchTab('chat')">💬 Chat</button>
                <button data-tab="whiteboard" onclick="switchTab('whiteboard')">📝 Whiteboard</button>
            </div>

            <!-- Chat Tab -->
            <div class="tab-content" id="chatTab">
                <div class="chat-messages" id="chatMessages">
                    <div style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;padding:1rem;">
                        💬 Chat will appear here
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()" />
                    <button onclick="sendChat()">Send</button>
                </div>
            </div>

            <!-- Whiteboard Tab -->
            <div class="tab-content hidden" id="whiteboardTab">
                <div class="whiteboard-container">
                    <canvas id="whiteboardCanvas"></canvas>
                    <div class="whiteboard-tools">
                        <button class="active" data-color="#667eea" onclick="setColor('#667eea', this)">🟣</button>
                        <button data-color="#ef4444" onclick="setColor('#ef4444', this)">🔴</button>
                        <button data-color="#22c55e" onclick="setColor('#22c55e', this)">🟢</button>
                        <button data-color="#fbbf24" onclick="setColor('#fbbf24', this)">🟡</button>
                        <button data-color="#ffffff" onclick="setColor('#ffffff', this)">⚪</button>
                        <button onclick="clearWhiteboard()">🗑️ Clear</button>
                        <button onclick="undoWhiteboard()">↩️ Undo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MARK STUDENT MODAL ===== -->
    <div class="modal-overlay" id="markModal">
        <div class="modal">
            <h3>📝 Mark Student Progress</h3>
            <form id="markForm">
                <div class="form-group">
                    <label>Score (0-100)</label>
                    <input type="number" id="markScore" placeholder="e.g., 85" min="0" max="100" required />
                </div>
                <div class="form-group">
                    <label>Feedback</label>
                    <textarea id="markFeedback" placeholder="Write your feedback for the student..."></textarea>
                </div>
                <div class="form-group">
                    <label>Strengths (comma separated)</label>
                    <input type="text" id="markStrengths" placeholder="e.g., Algebra, Problem Solving" />
                </div>
                <div class="form-group">
                    <label>Areas to Improve (comma separated)</label>
                    <input type="text" id="markWeaknesses" placeholder="e.g., Word Problems, Speed" />
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">✅ Submit & End Class</button>
                    <button type="button" class="btn-secondary" onclick="closeMarkModal()">Skip</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDy-j3_iZwv7IE7HYHircFeEWGdoGizf5M",
            authDomain: "harpslearn.firebaseapp.com",
            projectId: "harpslearn",
            storageBucket: "harpslearn.firebasestorage.app",
            messagingSenderId: "625210543198",
            appId: "1:625210543198:web:6faebd2af1465facf338cf",
            measurementId: "G-8Z8HVC5V5J"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // 🎯 GET CLASS DATA
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get('booking');
        const classId = bookingId || 'demo-' + Date.now();

        let currentUser = null;
        let userRole = 'tutor';
        let timerInterval = null;
        let seconds = 0;
        let isAudioMuted = false;
        let isVideoOff = false;
        let localStream = null;
        let bookingData = null;
        let studentId = null;
        let studentName = 'Student';
        let tutorId = null;
        let tutorName = 'Tutor';
        let subject = 'General';
        let parentId = null;

        // ============================================================
        // 🛠️ UTILITY
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function timeAgo(date) {
            if (!date) return 'N/A';
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            const days = Math.floor(hours / 24);
            if (days < 7) return days + 'd ago';
            return date.toLocaleDateString();
        }

        // ============================================================
        // ⏱️ TIMER
        // ============================================================
        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timerDisplay').textContent = formatTime(seconds);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ============================================================
        // 📹 WEBRTC
        // ============================================================
        async function initWebRTC() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;

                // Simulate remote
                document.getElementById('remoteVideoBox').querySelector('.placeholder').style.display = 'none';
                document.getElementById('remoteLabel').textContent = `👤 ${userRole === 'tutor' ? 'Student' : 'Tutor'} (Connected)`;

                showToast('📹 Camera and microphone connected!', 'success');
                startTimer();

            } catch (error) {
                console.error('WebRTC error:', error);
                showToast('⚠️ Could not access camera/microphone.', 'warning');
            }
        }

        function toggleAudio() {
            if (!localStream) return;
            isAudioMuted = !isAudioMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isAudioMuted);
            showToast(isAudioMuted ? '🔇 Audio muted' : '🔊 Audio unmuted', isAudioMuted ? 'warning' : 'success');
        }

        function toggleVideo() {
            if (!localStream) return;
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
            showToast(isVideoOff ? '📹 Video off' : '📹 Video on', isVideoOff ? 'warning' : 'success');
        }

        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('localVideo').srcObject = screenStream;
                showToast('🖥️ Screen sharing started!', 'success');
                screenStream.getVideoTracks()[0].onended = () => {
                    if (localStream) document.getElementById('localVideo').srcObject = localStream;
                    showToast('🖥️ Screen sharing ended', 'info');
                };
            } catch (error) {
                showToast('⚠️ Screen sharing cancelled', 'warning');
            }
        }

        // ============================================================
        // 💬 CHAT
        // ============================================================
        let chatUnsubscribe = null;

        function listenChat() {
            if (chatUnsubscribe) chatUnsubscribe();

            chatUnsubscribe = db.collection('classChat')
                .where('classId', '==', classId)
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('chatMessages');
                    if (snapshot.empty) {
                        container.innerHTML = `
                            <div style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;padding:1rem;">
                                💬 No messages yet
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const isSelf = data.userId === currentUser?.uid;
                        const time = data.timestamp?.toDate?.() || new Date();
                        html += `
                            <div class="msg ${isSelf ? 'self' : 'other'}">
                                <div class="name">${data.userName || 'User'} <span class="time">${time.toLocaleTimeString()}</span></div>
                                ${data.message}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                });
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                const user = auth.currentUser;
                if (!user) { showToast('Please login', 'error'); return; }

                const userDoc = await db.collection('users').doc(user.uid).get();
                const userName = userDoc.exists ? userDoc.data().fullName || 'User' : 'User';

                await db.collection('classChat').add({
                    classId: classId,
                    userId: user.uid,
                    userName: userName,
                    userRole: userRole,
                    message: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                input.value = '';
            } catch (error) {
                console.error('Error sending chat:', error);
                showToast('Error sending message', 'error');
            }
        }

        // ============================================================
        // 📝 WHITEBOARD
        // ============================================================
        let canvas = null;
        let ctx = null;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let currentColor = '#667eea';
        let lineWidth = 3;
        let drawingHistory = [];
        let historyIndex = -1;

        function initWhiteboard() {
            const container = document.getElementById('whiteboardTab');
            const canvasEl = document.getElementById('whiteboardCanvas');

            const height = container.clientHeight - 60;
            canvasEl.width = container.clientWidth - 20;
            canvasEl.height = Math.max(height, 200);

            canvas = canvasEl;
            ctx = canvas.getContext('2d');
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

            saveHistory();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startDraw(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function endDraw() {
            if (isDrawing) { isDrawing = false; saveHistory(); }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            isDrawing = true;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const pos = { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (isDrawing) { isDrawing = false; saveHistory(); }
        }

        function saveHistory() {
            if (!canvas) return;
            const data = canvas.toDataURL();
            if (historyIndex < drawingHistory.length - 1) {
                drawingHistory = drawingHistory.slice(0, historyIndex + 1);
            }
            drawingHistory.push(data);
            historyIndex = drawingHistory.length - 1;
            if (drawingHistory.length > 30) { drawingHistory.shift(); historyIndex--; }
        }

        function undoWhiteboard() {
            if (historyIndex <= 0) return;
            historyIndex--;
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = drawingHistory[historyIndex];
        }

        function clearWhiteboard() {
            if (!confirm('Clear the whiteboard?')) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveHistory();
        }

        function setColor(color, btn) {
            currentColor = color;
            ctx.strokeStyle = color;
            document.querySelectorAll('.whiteboard-tools button[data-color]').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        // ============================================================
        // 🗂️ SWITCH TAB
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-bar button').forEach(el => el.classList.remove('active'));

            document.getElementById(tab + 'Tab').classList.remove('hidden');
            document.querySelector(`.tab-bar button[data-tab="${tab}"]`).classList.add('active');

            if (tab === 'whiteboard') {
                setTimeout(initWhiteboard, 100);
            }
        }

        // ============================================================
        // 🔍 LOAD BOOKING DATA
        // ============================================================
        async function loadBookingData() {
            try {
                if (!bookingId) return;

                const doc = await db.collection('bookings').doc(bookingId).get();
                if (!doc.exists) return;

                bookingData = { id: doc.id, ...doc.data() };
                studentId = bookingData.studentId;
                studentName = bookingData.studentName || 'Student';
                tutorId = bookingData.tutorId;
                tutorName = bookingData.tutorName || 'Tutor';
                subject = bookingData.subject || 'General';
                parentId = bookingData.parentId || null;

                // Update UI
                document.getElementById('className').textContent = `📚 ${subject} Session`;
                const user = auth.currentUser;
                const isTutor = user && user.uid === tutorId;
                userRole = isTutor ? 'tutor' : 'student';

                document.getElementById('classSub').textContent =
                    `${isTutor ? 'Tutor' : 'Student'}: ${isTutor ? tutorName : studentName} • ${userRole === 'tutor' ? 'Student' : 'Tutor'}: ${userRole === 'tutor' ? studentName : tutorName}`;
                document.getElementById('remoteLabel').textContent = `👤 ${userRole === 'tutor' ? studentName : tutorName}`;

            } catch (error) {
                console.error('Error loading booking:', error);
            }
        }

        // ============================================================
        // 🚪 END CLASS WITH TUTOR MARKING
        // ============================================================
        function endClass() {
            if (!confirm('End the class? This will mark it as completed.')) return;

            // Check if user is tutor - show marking modal
            if (userRole === 'tutor') {
                document.getElementById('markModal').classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                // Student ends class - just complete without marking
                completeClassWithoutMark();
            }
        }

        function closeMarkModal() {
            document.getElementById('markModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('markForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const score = parseInt(document.getElementById('markScore').value);
            const feedback = document.getElementById('markFeedback').value.trim();
            const strengths = document.getElementById('markStrengths').value.split(',').map(s => s.trim()).filter(s => s);
            const weaknesses = document.getElementById('markWeaknesses').value.split(',').map(s => s.trim()).filter(s => s);

            if (!score || score < 0 || score > 100) {
                showToast('Please enter a valid score (0-100)', 'error');
                return;
            }

            const btn = this.querySelector('.btn-primary');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Submitting...';

            try {
                // Save tutor feedback
                await db.collection('tutorFeedback').add({
                    studentId: studentId,
                    tutorId: tutorId,
                    bookingId: bookingId,
                    subject: subject,
                    score: score,
                    feedback: feedback || 'No feedback provided',
                    strengths: strengths,
                    weaknesses: weaknesses,
                    tutorName: tutorName,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Update student progress with tutor mark
                const progressSnapshot = await db.collection('studentProgress')
                    .where('studentId', '==', studentId)
                    .get();

                if (!progressSnapshot.empty) {
                    for (const doc of progressSnapshot.docs) {
                        await db.collection('studentProgress').doc(doc.id).update({
                            overallTutorRating: score,
                            tutorFeedback: feedback || 'No feedback',
                            strengths: strengths,
                            weaknesses: weaknesses,
                            lastTutorMark: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                }

                // Send notification to parent
                if (parentId) {
                    await db.collection('notifications').add({
                        userId: parentId,
                        title: '📝 New Tutor Feedback',
                        message: `${studentName} scored ${score}% in ${subject}.\nFeedback: "${feedback || 'No feedback'}"`,
                        type: 'tutor_feedback',
                        studentId: studentId,
                        bookingId: bookingId,
                        read: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                // Send notification to student
                if (studentId) {
                    await db.collection('notifications').add({
                        userId: studentId,
                        title: '📝 New Feedback from Tutor',
                        message: `You scored ${score}% in ${subject}. ${feedback ? 'Feedback: "' + feedback + '"' : ''}`,
                        type: 'tutor_feedback',
                        bookingId: bookingId,
                        read: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                closeMarkModal();
                showToast('✅ Feedback submitted!', 'success');

                // Complete the class
                await completeClassInternal();

            } catch (error) {
                console.error('Error submitting feedback:', error);
                showToast('Error submitting feedback', 'error');
                btn.disabled = false;
                btn.innerHTML = '✅ Submit & End Class';
            }
        });

        async function completeClassWithoutMark() {
            await completeClassInternal();
        }

        async function completeClassInternal() {
            stopTimer();
            showToast('🚪 Class ended!', 'success');

            // Update booking status
            if (bookingId) {
                try {
                    await db.collection('bookings').doc(bookingId).update({
                        status: 'completed',
                        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        duration: seconds
                    });
                } catch (error) {
                    console.error('Error updating booking:', error);
                }
            }

            const totalMinutes = Math.floor(seconds / 60);
            const totalSeconds = seconds % 60;
            showToast(`📊 Class completed! Duration: ${totalMinutes}m ${totalSeconds}s`, 'success');

            // Notify both parties
            if (studentId) {
                await db.collection('notifications').add({
                    userId: studentId,
                    title: '🎉 Class Completed!',
                    message: `Your ${subject} class with ${tutorName} has been completed. Duration: ${totalMinutes}m ${totalSeconds}s`,
                    type: 'class_completed',
                    bookingId: bookingId,
                    read: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            if (parentId) {
                await db.collection('notifications').add({
                    userId: parentId,
                    title: '🎉 Class Completed!',
                    message: `${studentName}'s ${subject} class with ${tutorName} is complete. Duration: ${totalMinutes}m ${totalSeconds}s`,
                    type: 'class_completed',
                    bookingId: bookingId,
                    read: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            setTimeout(() => {
                const dashboard = userRole === 'tutor' ? 'tutor-dashboard.html' : 'student-dashboard.html';
                window.location.href = dashboard;
            }, 2000);
        }

        // ============================================================
        // 🚀 INIT
        // ============================================================
        auth.onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;

            await loadBookingData();
            await initWebRTC();
            listenChat();

            setTimeout(initWhiteboard, 500);

            if (bookingId) {
                try {
                    await db.collection('bookings').doc(bookingId).update({
                        status: 'in-progress',
                        startedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (error) {
                    console.error('Error updating booking status:', error);
                }
            }
        });

        console.log('🏠 Live Class Room loaded!');
        console.log('📹 WebRTC, 💬 Chat, 📝 Whiteboard, 📝 Tutor Marking!');
    </script>
