    <style>
        /* ============================================================
                RESET & BASE
                ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;

            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            position: relative;
        }

        /* ============================================================
                ANIMATED BACKGROUND PARTICLES
                ============================================================ */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        .particle:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; animation-duration: 18s; animation-delay: 2s; width: 6px; height: 6px; background: rgba(167, 139, 250, 0.15); }
        .particle:nth-child(3) { left: 45%; animation-duration: 12s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 65%; animation-duration: 20s; animation-delay: 1s; width: 5px; height: 5px; background: rgba(236, 72, 153, 0.15); }
        .particle:nth-child(5) { left: 80%; animation-duration: 16s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 50%; animation-duration: 22s; animation-delay: 5s; width: 8px; height: 8px; background: rgba(251, 191, 36, 0.1); }
        .particle:nth-child(7) { left: 90%; animation-duration: 13s; animation-delay: 6s; }
        .particle:nth-child(8) { left: 5%; animation-duration: 19s; animation-delay: 7s; width: 5px; height: 5px; background: rgba(52, 211, 153, 0.12); }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ============================================================
                GLOW ORBS
                ============================================================ */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .glow-1 {
            width: 500px;
            height: 500px;
            background: #667eea;
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }
        .glow-2 {
            width: 400px;
            height: 400px;
            background: #764ba2;
            bottom: -150px;
            left: -100px;
            animation-delay: 4s;
        }
        .glow-3 {
            width: 300px;
            height: 300px;
            background: #fbbf24;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 8s;
            opacity: 0.15;
        }
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.2); }
        }

        /* ============================================================
                MAIN CONTAINER
                ============================================================ */
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: containerFloat 3s ease-in-out infinite;
        }
        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* ============================================================
                CARD
                ============================================================ */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(167, 139, 250, 0.03), transparent 60%);
            pointer-events: none;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* ============================================================
                LOGO
                ============================================================ */
        .logo-emoji {
            font-size: 3.5rem;
            text-align: center;
            display: block;
            margin-bottom: 0.3rem;
            animation: logoPulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 8px 30px rgba(102, 126, 234, 0.3));
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            letter-spacing: -1px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        h1 span {
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .subtitle strong {
            color: #fbbf24;
            font-weight: 600;
        }

        /* ============================================================
                BUTTONS
                ============================================================ */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 2rem 0 1.5rem 0;
        }

        .btn {
            display: inline-block;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            text-align: center;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn:hover::after {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 48px rgba(124, 58, 237, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-3px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn .icon {
            margin-right: 6px;
        }

        /* ============================================================
                FEATURES
                ============================================================ */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.7rem 0.5rem;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            cursor: default;
        }
        .feature:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(167, 139, 250, 0.2);
        }
        .feature .icon {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 2px;
        }

        /* ============================================================
                EXAM TAGS
                ============================================================ */
        .exam-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.2rem;
        }
        .exam-tag {
            font-size: 0.65rem;
            padding: 3px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ============================================================
                FOOTER
                ============================================================ */
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.65rem;
            letter-spacing: 0.5px;
        }
        .footer span {
            color: rgba(255, 255, 255, 0.3);
        }

        /* ============================================================
                TOAST
                ============================================================ */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 5000;
            animation: toastSlide 0.4s ease;
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .toast.success {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.2);
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .toast.warning {
            background: rgba(251, 191, 36, 0.2);
            border-color: rgba(251, 191, 36, 0.2);
        }
        @keyframes toastSlide {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ============================================================
                RESPONSIVE
                ============================================================ */
        @media (max-width: 480px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 20px;
            }
            h1 {
                font-size: 2rem;
            }

                font-size: 2.8rem;
            }

                padding: 14px 20px;

            .features {

                gap: 0.4rem;
            }
            .feature {
                font-size: 0.7rem;
                padding: 0.5rem 0.3rem;
            }
            .feature .icon {
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.2rem 0.8rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .features {
                grid-template-columns: 1fr 1fr;
            }
            .btn {
                font-size: 0.8rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>

    <script>
        // ============================================================
        // 🔥 FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDy-j3_iZwv7IE7HYHircFeEWGdoGizf5M",
            authDomain: "harpslearn.firebaseapp.com",
            projectId: "harpslearn",
            storageBucket: "harpslearn.firebasestorage.app",
            messagingSenderId: "625210543198",
            appId: "1:625210543198:web:6faebd2af1465facf338cf",
            measurementId: "G-8Z8HVC5V5J"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // 🛠️ TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        // ============================================================
        // 🚀 CHECK IF USER IS ALREADY LOGGED IN
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                // User is signed in, check their role
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        const role = doc.data().role;
                        if (role === 'student') {
                            window.location.href = 'student-dashboard.html';
                        } else if (role === 'tutor') {
                            window.location.href = 'tutor-dashboard.html';
                        } else if (role === 'parent') {
                            window.location.href = 'parent-dashboard.html';
                        }
                    }
                }).catch(() => {});
            }
        });

        console.log('🔥 HarpsLearn loaded!');
        console.log('📱 Premium landing page with SEO & Open Graph!');
        console.log('📸 Sharing preview image ready!');
    </script>
