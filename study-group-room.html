<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Study Group Room - HarpsLearn</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        .particle:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; animation-duration: 18s; animation-delay: 2s; width: 6px; height: 6px; background: rgba(167,139,250,0.15); }
        .particle:nth-child(3) { left: 45%; animation-duration: 12s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 65%; animation-duration: 20s; animation-delay: 1s; width: 5px; height: 5px; background: rgba(236,72,153,0.15); }
        .particle:nth-child(5) { left: 80%; animation-duration: 16s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 50%; animation-duration: 22s; animation-delay: 5s; width: 8px; height: 8px; background: rgba(251,191,36,0.1); }
        .particle:nth-child(7) { left: 90%; animation-duration: 13s; animation-delay: 6s; }
        .particle:nth-child(8) { left: 5%; animation-duration: 19s; animation-delay: 7s; width: 5px; height: 5px; background: rgba(52,211,153,0.12); }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .navbar {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0.6rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .navbar .back-btn:hover { background: rgba(255,255,255,0.2); }
        .navbar .group-info {
            flex: 1;
            text-align: center;
        }
        .navbar .group-info .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }
        .navbar .group-info .sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
        }
        .navbar .share-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .navbar .share-btn:hover { background: rgba(255,255,255,0.2); }
        .navbar .menu-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            margin-left: 0.4rem;
        }
        .navbar .menu-btn:hover { background: rgba(255,255,255,0.2); }

        .container {
            position: relative;
            z-index: 5;
            max-width: 900px;
            margin: 0 auto;
            padding: 0.8rem;
            display: flex;
            gap: 1rem;
            height: calc(100vh - 70px);
        }

        .members-sidebar {
            width: 220px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1rem;
            flex-shrink: 0;
            overflow-y: auto;
            display: none;
        }
        .members-sidebar::-webkit-scrollbar { width: 3px; }
        .members-sidebar::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 4px; }

        .members-sidebar .title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 0.6rem;
            font-weight: 600;
        }
        .members-sidebar .member-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.3rem 0.4rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            justify-content: space-between;
        }
        .members-sidebar .member-item:hover { background: rgba(255,255,255,0.05); }
        .members-sidebar .member-item .left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            min-width: 0;
        }
        .members-sidebar .member-item .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: white;
            flex-shrink: 0;
        }
        .members-sidebar .member-item .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .members-sidebar .member-item .role-badge {
            font-size: 0.55rem;
            padding: 1px 8px;
            border-radius: 8px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .members-sidebar .member-item .role-badge.student {
            background: rgba(52,211,153,0.2);
            color: #34d399;
        }
        .members-sidebar .member-item .role-badge.tutor {
            background: rgba(167,139,250,0.2);
            color: #a78bfa;
        }
        .members-sidebar .member-item .role-badge.teacher {
            background: rgba(251,191,36,0.2);
            color: #fbbf24;
        }
        .members-sidebar .member-item .role-badge.admin {
            background: rgba(236,72,153,0.2);
            color: #ec4899;
        }
        .members-sidebar .member-item .admin-actions {
            display: flex;
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .members-sidebar .member-item .admin-actions button {
            background: rgba(255,255,255,0.05);
            border: none;
            color: rgba(255,255,255,0.4);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }
        .members-sidebar .member-item .admin-actions button:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .members-sidebar .member-item .admin-actions button.danger:hover {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
        }

        @media (min-width: 768px) {
            .members-sidebar { display: block; }
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 4px; }

        .message {
            margin-bottom: 0.6rem;
            display: flex;
            flex-direction: column;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.system { align-items: center; }
        .message.system .bubble {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            font-style: italic;
        }
        .message.join { align-items: center; }
        .message.join .bubble {
            background: rgba(52,211,153,0.1);
            color: #34d399;
            font-size: 0.8rem;
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
        }
        .message.user { align-items: flex-start; }
        .message.self { align-items: flex-end; }
        .message .msg-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.1rem;
            font-size: 0.8rem;
        }
        .message .msg-header .name {
            font-weight: 600;
            color: #fff;
        }
        .message .msg-header .role-badge {
            font-size: 0.55rem;
            padding: 1px 8px;
            border-radius: 8px;
            font-weight: 600;
        }
        .message .msg-header .role-badge.student {
            background: rgba(52,211,153,0.2);
            color: #34d399;
        }
        .message .msg-header .role-badge.tutor {
            background: rgba(167,139,250,0.2);
            color: #a78bfa;
        }
        .message .msg-header .role-badge.teacher {
            background: rgba(251,191,36,0.2);
            color: #fbbf24;
        }
        .message .msg-header .role-badge.admin {
            background: rgba(236,72,153,0.2);
            color: #ec4899;
        }
        .message .msg-header .time {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.3);
        }
        .message .bubble {
            max-width: 85%;
            padding: 0.5rem 1rem;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            background: rgba(255,255,255,0.06);
            color: #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .message.self .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 4px;
            border-bottom-left-radius: 14px;
        }
        .message .bubble .note-title {
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 0.2rem;
            font-size: 0.95rem;
        }
        .message .bubble .note-content {
            white-space: pre-wrap;
        }
        .message .bubble .note-badge {
            display: inline-block;
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            font-size: 0.6rem;
            padding: 1px 8px;
            border-radius: 8px;
            margin-bottom: 0.2rem;
        }

        .chat-input {
            padding: 0.6rem 1rem;
            background: rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 0.6rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .chat-input .input-wrapper {
            flex: 1;
            display: flex;
            gap: 0.4rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .chat-input textarea {
            flex: 1;
            padding: 0.5rem 0.8rem;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            min-height: 40px;
            max-height: 120px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            transition: all 0.3s ease;
        }
        .chat-input textarea::placeholder { color: rgba(255,255,255,0.3); }
        .chat-input textarea:focus {
            outline: none;
            background: rgba(255,255,255,0.1);
        }
        .chat-input .action-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            height: 40px;
        }
        .chat-input .action-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .chat-input .action-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-color: transparent;
            padding: 6px 18px;
        }
        .chat-input .action-btn.primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(102,126,234,0.3);
        }
        .chat-input .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay .modal {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.06);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay .modal h3 { font-size: 1.3rem; color: #fff; margin-bottom: 1rem; }
        .modal-overlay .modal .form-group { margin-bottom: 1rem; }
        .modal-overlay .modal .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: rgba(255,255,255,0.7); font-size: 0.9rem; }
        .modal-overlay .modal .form-group input,
        .modal-overlay .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .modal-overlay .modal .form-group input:focus,
        .modal-overlay .modal .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-overlay .modal .form-group textarea { min-height: 100px; resize: vertical; }
        .modal-overlay .modal .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .modal-overlay .modal .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .modal-overlay .modal .modal-actions .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .modal-overlay .modal .modal-actions .btn-secondary { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); }
        .modal-overlay .modal .modal-actions .btn-danger { background: #ef4444; color: white; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 5000;
            animation: toastSlide 0.4s ease;
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .toast.success { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.2); }
        .toast.error { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.2); }
        .toast.warning { background: rgba(251,191,36,0.2); border-color: rgba(251,191,36,0.2); }
        @keyframes toastSlide {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .group-menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 0.4rem 0;
            min-width: 160px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: none;
            z-index: 200;
        }
        .group-menu-dropdown.active { display: block; }
        .group-menu-dropdown button {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1rem;
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            width: 100%;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .group-menu-dropdown button:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .group-menu-dropdown button.danger { color: #ef4444; }
        .group-menu-dropdown button.danger:hover { background: rgba(239,68,68,0.1); }

        @media (max-width: 768px) {
            .container { flex-direction: column; height: calc(100vh - 70px); }
            .members-sidebar { display: none; }
            .chat-input .action-btn span { display: none; }
            .chat-input .action-btn { padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== PARTICLES BACKGROUND ===== -->
    <div id="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <div class="navbar">
        <button class="back-btn" onclick="window.location.href='study-groups.html'">← Back</button>
        <div class="group-info">
            <div class="name" id="groupName">Loading...</div>
            <div class="sub" id="groupSub">📚 Loading... • 👥 0 members</div>
        </div>
        <div style="display:flex;align-items:center;gap:0.3rem;position:relative;">
            <button class="share-btn" onclick="shareGroup()">🔗 Share</button>
            <button class="menu-btn" id="groupMenuBtn" onclick="toggleGroupMenu()">⚙️</button>
            <div class="group-menu-dropdown" id="groupMenuDropdown">
                <button onclick="deleteGroup()" class="danger">🗑️ Delete Group</button>
                <!-- Other admin actions can go here -->
            </div>
        </div>
    </div>

    <!-- ===== CONTAINER ===== -->
    <div class="container">

        <!-- Members Sidebar -->
        <div class="members-sidebar" id="membersSidebar">
            <div class="title">👥 Members</div>
            <div id="membersList">
                <div style="color:rgba(255,255,255,0.3);font-size:0.8rem;">Loading...</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div style="text-align:center;color:rgba(255,255,255,0.3);padding:2rem;font-size:0.9rem;">
                    🎓 Welcome to the study room!<br>
                    Start learning together!
                </div>
            </div>

            <div class="chat-input">
                <div class="input-wrapper">
                    <button class="action-btn" onclick="openNoteModal()" title="Share Study Note">
                        📝 <span>Note</span>
                    </button>
                    <textarea id="messageInput" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
                </div>
                <button class="action-btn primary" onclick="sendMessage()" id="sendBtn">
                    ➤ <span>Send</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== NOTE MODAL ===== -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal">
            <h3>📝 Share Study Note</h3>
            <form id="noteForm">
                <div class="form-group">
                    <label>Note Title</label>
                    <input type="text" id="noteTitle" placeholder="e.g., Quadratic Equations Summary" required />
                </div>
                <div class="form-group">
                    <label>Note Content</label>
                    <textarea id="noteContent" placeholder="Write your study notes here..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Share Note</button>
                    <button type="button" class="btn-secondary" onclick="closeNoteModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== CONFIRM MODAL ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMessage" style="color:rgba(255,255,255,0.7);margin-bottom:1rem;"></p>
            <div class="modal-actions">
                <button class="btn-danger" id="confirmBtn">Confirm</button>
                <button class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDy-j3_iZwv7IE7HYHircFeEWGdoGizf5M",
            authDomain: "harpslearn.firebaseapp.com",
            projectId: "harpslearn",
            storageBucket: "harpslearn.firebasestorage.app",
            messagingSenderId: "625210543198",
            appId: "1:625210543198:web:6faebd2af1465facf338cf",
            measurementId: "G-8Z8HVC5V5J"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // GLOBALS
        // ============================================================
        let groupId = null;
        let groupData = null;
        let currentUser = null;
        let userData = null;
        let messagesUnsubscribe = null;
        let membersUnsubscribe = null;
        let allMembers = [];
        let currentRole = 'student';
        let isCreator = false;
        let isAdmin = false;
        let confirmCallback = null;

        // ============================================================
        // UTILITY
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            return date.toLocaleDateString();
        }

        function getRoleBadge(role) {
            const roleMap = { student: 'Student', tutor: 'Tutor', teacher: 'Teacher', admin: 'Admin' };
            return roleMap[role] || role || 'Student';
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        // ============================================================
        // LOAD GROUP
        // ============================================================
        async function loadGroup() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                groupId = urlParams.get('id');

                if (!groupId) {
                    showToast('No group selected', 'error');
                    setTimeout(() => window.location.href = 'study-groups.html', 1500);
                    return;
                }

                const user = auth.currentUser;
                if (!user) { window.location.href = 'index.html'; return; }
                currentUser = user;

                // Get user data
                const userDoc = await db.collection('users').doc(user.uid).get();
                userData = userDoc.exists ? userDoc.data() : {};
                currentRole = userData.role || 'student';

                // Get group data
                const doc = await db.collection('studyGroups').doc(groupId).get();
                if (!doc.exists) {
                    showToast('Group not found', 'error');
                    setTimeout(() => window.location.href = 'study-groups.html', 1500);
                    return;
                }

                groupData = { id: doc.id, ...doc.data() };
                isCreator = groupData.creatorId === user.uid;

                // Check if user is a member
                const memberCheck = await db.collection('groupMembers')
                    .where('userId', '==', user.uid)
                    .where('groupId', '==', groupId)
                    .get();

                if (memberCheck.empty) {
                    showToast('⚠️ You are not a member of this group. Joining now...', 'warning');
                    await joinGroup();
                    return;
                }

                // Determine if user is admin (creator or role 'admin')
                const memberDoc = memberCheck.docs[0];
                const memberRole = memberDoc.data().role || 'member';
                isAdmin = isCreator || memberRole === 'admin';

                // Update UI
                document.getElementById('groupName').textContent = groupData.name || 'Study Group';
                document.getElementById('groupSub').textContent = `📚 ${groupData.subject || 'General'} • 👥 ${groupData.members || 0} members`;

                // Show/hide admin menu items
                const menuBtn = document.getElementById('groupMenuBtn');
                if (isAdmin) {
                    menuBtn.style.display = 'block';
                } else {
                    menuBtn.style.display = 'none';
                }

                // Load messages and members
                listenMessages();
                listenMembers();

            } catch (error) {
                console.error('Error loading group:', error);
                showToast('Error loading group', 'error');
            }
        }

        // ============================================================
        // JOIN GROUP (auto-join if not member)
        // ============================================================
        async function joinGroup() {
            try {
                const user = auth.currentUser;
                if (!user) return;

                const groupRef = db.collection('studyGroups').doc(groupId);
                await groupRef.update({
                    members: firebase.firestore.FieldValue.increment(1)
                });

                await db.collection('groupMembers').add({
                    userId: user.uid,
                    groupId: groupId,
                    role: currentRole || 'student',
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                const userName = userData.fullName || 'Someone';
                await db.collection('groupMessages').add({
                    groupId: groupId,
                    userId: user.uid,
                    userName: userName,
                    userRole: currentRole || 'student',
                    type: 'join',
                    message: `${userName} joined the group! 🎉`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('✅ Joined the group!', 'success');
                // Reload to show messages
                listenMessages();
                listenMembers();

            } catch (error) {
                console.error('Error joining group:', error);
            }
        }

        // ============================================================
        // LISTEN MESSAGES (REAL-TIME)
        // ============================================================
        function listenMessages() {
            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection('groupMessages')
                .where('groupId', '==', groupId)
                .orderBy('createdAt', 'asc')
                .onSnapshot((snapshot) => {
                    const messages = [];
                    snapshot.forEach(doc => {
                        messages.push({ id: doc.id, ...doc.data() });
                    });
                    renderMessages(messages);
                }, (error) => {
                    console.error('Messages listener error:', error);
                });
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');

            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;color:rgba(255,255,255,0.3);padding:2rem;font-size:0.9rem;">
                        🎓 Welcome to the study room!<br>
                        Start learning together!
                    </div>
                `;
                return;
            }

            let html = '';
            const user = auth.currentUser;

            for (const msg of messages) {
                const isSelf = msg.userId === user?.uid;
                const time = msg.createdAt?.toDate?.() || new Date();
                const roleBadge = msg.userRole || 'student';

                if (msg.type === 'system') {
                    html += `
                        <div class="message system">
                            <div class="bubble">📢 ${msg.message}</div>
                        </div>
                    `;
                    continue;
                }

                if (msg.type === 'join') {
                    html += `
                        <div class="message join">
                            <div class="bubble">👋 ${msg.message}</div>
                        </div>
                    `;
                    continue;
                }

                const isNote = msg.type === 'note';
                const noteTitle = msg.noteTitle || '';
                const noteContent = msg.noteContent || '';

                html += `
                    <div class="message ${isSelf ? 'self' : 'user'}">
                        <div class="msg-header">
                            <span class="name">${msg.userName || 'Anonymous'}</span>
                            <span class="role-badge ${roleBadge}">${getRoleBadge(roleBadge)}</span>
                            <span class="time">${timeAgo(time)}</span>
                        </div>
                        <div class="bubble">
                            ${isNote ? `
                                <div class="note-badge">📝 Study Note</div>
                                <div class="note-title">${noteTitle}</div>
                                <div class="note-content">${noteContent}</div>
                            ` : `
                                ${msg.message}
                            `}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // LISTEN MEMBERS (REAL-TIME)
        // ============================================================
        function listenMembers() {
            if (membersUnsubscribe) membersUnsubscribe();

            membersUnsubscribe = db.collection('groupMembers')
                .where('groupId', '==', groupId)
                .onSnapshot(async (snapshot) => {
                    const members = [];
                    for (const doc of snapshot.docs) {
                        const data = doc.data();
                        const userDoc = await db.collection('users').doc(data.userId).get();
                        const userData = userDoc.exists ? userDoc.data() : {};
                        members.push({
                            ...data,
                            id: doc.id,
                            userId: data.userId,
                            userName: userData.fullName || 'Anonymous',
                            userAvatar: userData.profilePic || '',
                            userRole: userData.role || data.role || 'student'
                        });
                    }
                    allMembers = members;
                    renderMembers(members);
                }, (error) => {
                    console.error('Members listener error:', error);
                });
        }

        function renderMembers(members) {
            const container = document.getElementById('membersList');

            if (!members || members.length === 0) {
                container.innerHTML = `<div style="color:rgba(255,255,255,0.3);font-size:0.8rem;">No members</div>`;
                return;
            }

            // Sort: admins first, then tutors, then students
            const order = { admin: 0, tutor: 1, teacher: 2, student: 3 };
            members.sort((a, b) => (order[a.userRole] || 3) - (order[b.userRole] || 3));

            let html = '';
            for (const member of members) {
                const name = member.userName || 'Anonymous';
                const initial = getInitials(name);
                const role = member.userRole || 'student';
                const isCurrentUser = member.userId === currentUser?.uid;
                const isAdminUser = isAdmin || isCreator; // Current user is admin/creator
                const canManage = isAdminUser && !isCurrentUser; // Admin can manage others, but not self

                html += `
                    <div class="member-item">
                        <div class="left">
                            <div class="avatar">${initial}</div>
                            <span class="name">${name} ${isCreator && member.userId === groupData.creatorId ? '👑' : ''}</span>
                            <span class="role-badge ${role}">${getRoleBadge(role)}</span>
                        </div>
                        ${canManage ? `
                            <div class="admin-actions">
                                ${role !== 'admin' ? `<button onclick="promoteToAdmin('${member.userId}')" title="Make Admin">👑</button>` : ''}
                                <button class="danger" onclick="removeMember('${member.userId}')" title="Remove">✕</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            container.innerHTML = html;

            // Update member count in header
            document.getElementById('groupSub').textContent = `📚 ${groupData?.subject || 'General'} • 👥 ${members.length} members`;
        }

        // ============================================================
        // ADMIN ACTIONS
        // ============================================================
        function toggleGroupMenu() {
            const dropdown = document.getElementById('groupMenuDropdown');
            dropdown.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            const btn = document.getElementById('groupMenuBtn');
            const dropdown = document.getElementById('groupMenuDropdown');
            if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('active');
            }
        });

        // Promote member to admin
        async function promoteToAdmin(userId) {
            try {
                if (!isAdmin && !isCreator) {
                    showToast('Only admins can promote members.', 'error');
                    return;
                }

                // Find the member doc
                const memberDoc = allMembers.find(m => m.userId === userId);
                if (!memberDoc) {
                    showToast('Member not found.', 'error');
                    return;
                }

                await db.collection('groupMembers').doc(memberDoc.id).update({
                    role: 'admin'
                });

                // Send system message
                const user = auth.currentUser;
                const userName = userData?.fullName || 'Admin';
                const targetName = memberDoc.userName || 'Someone';

                await db.collection('groupMessages').add({
                    groupId: groupId,
                    userId: user.uid,
                    userName: userName,
                    userRole: 'admin',
                    type: 'system',
                    message: `👑 ${userName} promoted ${targetName} to Admin!`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast(`✅ ${targetName} is now an admin!`, 'success');

            } catch (error) {
                console.error('Error promoting:', error);
                showToast('Error promoting member', 'error');
            }
        }

        // Remove member
        async function removeMember(userId) {
            try {
                if (!isAdmin && !isCreator) {
                    showToast('Only admins can remove members.', 'error');
                    return;
                }

                if (userId === currentUser?.uid) {
                    showToast('You cannot remove yourself.', 'error');
                    return;
                }

                // Find the member doc
                const memberDoc = allMembers.find(m => m.userId === userId);
                if (!memberDoc) {
                    showToast('Member not found.', 'error');
                    return;
                }

                const targetName = memberDoc.userName || 'Someone';

                // Check if the target is the creator (can't remove creator)
                if (userId === groupData.creatorId) {
                    showToast('Cannot remove the group creator.', 'error');
                    return;
                }

                // Show confirmation
                showConfirm(
                    `Remove ${targetName}?`,
                    `Are you sure you want to remove ${targetName} from the group?`,
                    async () => {
                        await db.collection('groupMembers').doc(memberDoc.id).delete();

                        // Decrease member count
                        const groupRef = db.collection('studyGroups').doc(groupId);
                        await groupRef.update({
                            members: firebase.firestore.FieldValue.increment(-1)
                        });

                        // Send system message
                        const user = auth.currentUser;
                        const adminName = userData?.fullName || 'Admin';
                        await db.collection('groupMessages').add({
                            groupId: groupId,
                            userId: user.uid,
                            userName: adminName,
                            userRole: 'admin',
                            type: 'system',
                            message: `👋 ${adminName} removed ${targetName} from the group.`,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        showToast(`✅ ${targetName} removed from group.`, 'success');
                    }
                );

            } catch (error) {
                console.error('Error removing member:', error);
                showToast('Error removing member', 'error');
            }
        }

        // Delete Group
        async function deleteGroup() {
            try {
                if (!isCreator) {
                    showToast('Only the group creator can delete this group.', 'error');
                    return;
                }

                showConfirm(
                    'Delete Group?',
                    `Are you sure you want to permanently delete "${groupData.name}"? This cannot be undone. All messages and members will be removed.`,
                    async () => {
                        // Delete all messages
                        const messagesSnapshot = await db.collection('groupMessages')
                            .where('groupId', '==', groupId)
                            .get();
                        for (const doc of messagesSnapshot.docs) {
                            await db.collection('groupMessages').doc(doc.id).delete();
                        }

                        // Delete all members
                        const membersSnapshot = await db.collection('groupMembers')
                            .where('groupId', '==', groupId)
                            .get();
                        for (const doc of membersSnapshot.docs) {
                            await db.collection('groupMembers').doc(doc.id).delete();
                        }

                        // Delete the group document
                        await db.collection('studyGroups').doc(groupId).delete();

                        showToast('🗑️ Group deleted successfully.', 'success');
                        setTimeout(() => {
                            window.location.href = 'study-groups.html';
                        }, 1500);
                    }
                );

            } catch (error) {
                console.error('Error deleting group:', error);
                showToast('Error deleting group', 'error');
            }
        }

        // ============================================================
        // CONFIRM MODAL
        // ============================================================
        function showConfirm(title, message, callback) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            confirmCallback = callback;
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            document.body.style.overflow = '';
            confirmCallback = null;
        }

        document.getElementById('confirmBtn').addEventListener('click', function() {
            if (confirmCallback) {
                confirmCallback();
                closeConfirmModal();
            }
        });

        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) closeConfirmModal();
        });

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) return;

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            try {
                const user = auth.currentUser;
                if (!user) { showToast('Please login', 'error'); return; }

                const userName = userData?.fullName || 'Anonymous';

                await db.collection('groupMessages').add({
                    groupId: groupId,
                    userId: user.uid,
                    userName: userName,
                    userRole: currentRole || 'student',
                    message: text,
                    type: 'text',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                input.value = '';
                input.style.height = 'auto';

            } catch (error) {
                console.error('Error sending message:', error);
                showToast('Error sending message', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // ============================================================
        // SHARE NOTE
        // ============================================================
        function openNoteModal() {
            document.getElementById('noteModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.remove('active');
            document.body.style.overflow = '';
            document.getElementById('noteForm').reset();
        }

        document.getElementById('noteForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();

            if (!title || !content) {
                showToast('Please fill in both title and content', 'warning');
                return;
            }

            const btn = this.querySelector('.btn-primary');
            btn.disabled = true;
            btn.textContent = 'Sharing...';

            try {
                const user = auth.currentUser;
                if (!user) { showToast('Please login', 'error'); return; }

                const userName = userData?.fullName || 'Anonymous';

                await db.collection('groupMessages').add({
                    groupId: groupId,
                    userId: user.uid,
                    userName: userName,
                    userRole: currentRole || 'student',
                    message: `📝 ${title}`,
                    type: 'note',
                    noteTitle: title,
                    noteContent: content,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('✅ Note shared!', 'success');
                closeNoteModal();

            } catch (error) {
                console.error('Error sharing note:', error);
                showToast('Error sharing note', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Share Note';
            }
        });

        // Close modal on overlay click
        document.getElementById('noteModal').addEventListener('click', function(e) {
            if (e.target === this) closeNoteModal();
        });

        // ============================================================
        // SHARE GROUP LINK
        // ============================================================
        function shareGroup() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: `Join my study group on HarpsLearn!`,
                    text: `Join "${groupData?.name || 'Study Group'}" on HarpsLearn and let's study together! 🎓`,
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('🔗 Group link copied! Share with friends', 'success');
                }).catch(() => {
                    showToast('🔗 ' + url, 'info');
                });
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT
        // ============================================================
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
            const el = e.target;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        // ============================================================
        // INIT
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                loadGroup();
            }
        });

        console.log('🏠 Study Group Room - Admin Powers Activated!');
        console.log('👑 Creator can delete, promote admins, remove members.');
    </script>

</body>
